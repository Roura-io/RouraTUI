name: Release Verification

on:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  verify-m3-artifact:
    runs-on: ubuntu-24.04
    steps:
      - name: Download published release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "${{ github.event.release.tag_name }}" --repo "${{ github.repository }}"

      - name: Verify M3 artifact checksum
        run: sha256sum --check rouratui-darwin-arm64.tar.gz.sha256

      - name: Verify archive contents
        run: tar -tzf rouratui-darwin-arm64.tar.gz | grep -Fx rouratui
